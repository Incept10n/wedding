name: Build and Push front to dockerhub

# Только сборка и пуш образа. В кластер ничего не деплоим (нет kubectl/KUBE_CONFIG):
# образ с мутабельным тегом `:front` подхватывается после
# `kubectl rollout restart deployment frontend -n wedding`.
#
# Требуемые секреты репозитория: DOCKER_USERNAME, DOCKER_PASSWORD.
#
# Инфраструктура (Namespace/Deployment/Service/Certificate/edge-nginx)
# живёт в Incept10n/inceptech, apps/wedding/.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push-front:
    name: Push front Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: incept1on/wedding

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: incept1on/wedding:front
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
