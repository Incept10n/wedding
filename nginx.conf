server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite можно кешировать навсегда.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем, чтобы деплой был виден сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
